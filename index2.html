<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高鐵 × 迴轉壽司聯合列車</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* ================= NAVBAR ================= */
        .navbar {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ffeaa7;
            transform: scale(1.05);
        }

        /* ================= HERO ================= */
        .hero {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 120px 20px;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.35);
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.5rem;
            color: #f1f1f1;
            margin-top: 1rem;
        }

        .hero .subtitle {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-top: 0.5rem;
        }

        .cta-button {
            margin-top: 2rem;
            background: #e74c3c;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .cta-button:hover {
            background: #c0392b;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container">

        <!-- 🔥 LOGO改圖片 -->
        <div class="logo-section">
            <img class="logo" src="images/logo.png" alt="logo">
            <span class="brand-name">高鐵壽司列車</span>
        </div>

        <ul class="nav-links">
            <li><a href="#home">首頁</a></li>
            <li><a href="#about">介紹</a></li>
            <li><a href="#video">影片</a></li>
            <li><a href="#booking">訂票</a></li>
        </ul>

    </div>
</nav>

<!-- HERO -->
<section id="home" class="hero">
    <div class="hero-content">
        <h1>高鐵 × 迴轉壽司聯合列車</h1>
        <p>速度與美味的完美結合</p>
        <p class="subtitle">全新移動美食體驗</p>

        <button class="cta-button">立即訂票</button>
    </div>
</section>

</body>
</html>
