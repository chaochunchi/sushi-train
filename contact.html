<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡 - 壽司列車</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 導航列 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo-section">
                <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="30" width="35" height="35" rx="8" fill="#E74C3C" opacity="0.9"/>
                    <circle cx="18" cy="42" r="4" fill="#FFF"/>
                    <circle cx="28" cy="42" r="4" fill="#FFF"/>
                    <circle cx="38" cy="42" r="4" fill="#FFF"/>
                    <polygon points="45,48 50,40 55,48" fill="#FFF"/>
                    <ellipse cx="70" cy="45" rx="18" ry="15" fill="#F5E6D3"/>
                    <circle cx="65" cy="42" r="5" fill="#2ECC71"/>
                    <circle cx="75" cy="42" r="5" fill="#E74C3C"/>
                    <path d="M 60 55 Q 70 58 80 55" stroke="#E74C3C" stroke-width="2" fill="none"/>
                </svg>
                <span class="brand-name">壽司列車</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#home">首頁</a></li>
                <li><a href="about.html">介紹</a></li>
                <li><a href="menu.html">菜單</a></li>
                <li><a href="booking.html">訂票</a></li>
                <li><a href="reviews.html">評價</a></li>
                <li><a href="membership.html">免費會員</a></li>
                <li><a href="contact.html">聯絡</a></li>
            </ul>
        </div>
    </nav>

    <!-- 聯絡內容 -->
    <section class="contact-section">
        <div class="container">
            <h1>📞 聯絡我們</h1>
            <p class="section-subtitle">有任何問題或建議，歡迎與我們聯繫</p>

            <div class="contact-content">
                <div class="contact-info">
                    <h2>聯絡方式</h2>
                    <div class="info-card">
                        <div class="info-icon">📧</div>
                        <h3>電子郵件</h3>
                        <p>support@sushitrain.tw</p>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">📞</div>
                        <h3>客服電話</h3>
                        <p>0800-123-4567</p>
                        <p class="info-note">週一至週五 09:00-18:00</p>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">📍</div>
                        <h3>服務中心</h3>
                        <p>台北市中山區春期路21號</p>
                        <p>高鐵台北站 1樓</p>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">⏰</div>
                        <h3>營業時間</h3>
                        <p>09:00 - 21:00</p>
                        <p class="info-note">全年無休</p>
                    </div>
                </div>

                <div class="contact-form">
                    <h2>留言表單</h2>
                    <form id="contactForm" class="form">
                        <div class="form-group">
                            <label>姓名 <span class="required">*</span></label>
                            <input type="text" placeholder="請輸入姓名" required>
                        </div>
                        <div class="form-group">
                            <label>電子郵件 <span class="required">*</span></label>
                            <input type="email" placeholder="請輸入電子郵件" required>
                        </div>
                        <div class="form-group">
                            <label>電話 <span class="required">*</span></label>
                            <input type="tel" placeholder="請輸入電話號碼" required>
                        </div>
                        <div class="form-group">
                            <label>主題 <span class="required">*</span></label>
                            <select required>
                                <option value="">-- 請選擇 --</option>
                                <option value="booking">訂票相關</option>
                                <option value="menu">菜單相關</option>
                                <option value="service">服務回饋</option>
                                <option value="complaint">客訴</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>訊息 <span class="required">*</span></label>
                            <textarea placeholder="請輸入您的訊息" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="submit-button">送出訊息</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 壽司列車。版權所有。</p>
            <div class="footer-links">
                <a href="#">隱私政策</a> | 
                <a href="#">服務條款</a> | 
                <a href="contact.html">聯絡我們</a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
