    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>

                <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

                    <circle cx="28" cy="42" r="4" fill="#FFF"/>
                    <circle cx="38" cy="42" r="4" fill="#FFF"/>
                    <polygon points="45,48 50,40 55,48" fill="#FFF"/>
                    <ellipse cx="70" cy="45" rx="18" ry="15" fill="#F5E6D3"/>
                    <circle cx="65" cy="42" r="5" fill="#2ECC71"/>
                    <circle cx="75" cy="42" r="5" fill="#E74C3C"/>
                    <path d="M 60 55 Q 70 58 80 55" stroke="#E74C3C" stroke-width="2" fill="none"/>
                </svg>
                <span class="brand-name">壽司列車</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#home">首頁</a></li>
                <li><a href="about.html">介紹</a></li>

            </ul>

    <!-- 訂票表單 -->
    <section class="booking-section">
        <div class="container">
            <h1>🎫 訂票</h1>
            <p class="section-subtitle">選擇你的完美旅程</p>

            <div class="booking-wrapper">
                <form id="bookingForm" class="booking-form">
                    <div class="form-group">
                        <label>出發地 <span class="required">*</span></label>
                        <select id="departure" required>
                            <option value="">-- 請選擇 --</option>
                            <option value="taipei">台北站</option>
                            <option value="hsinchu">新竹站</option>
                            <option value="miaoli">苗栗站</option>
                            <option value="taichung">台中站</option>
                            <option value="changhua">彰化站</option>
                            <option value="yunlin">雲林站</option>
                            <option value="chiayi">嘉義站</option>
                            <option value="tainan">台南站</option>
                            <option value="kaohsiung">高雄站</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>目的地 <span class="required">*</span></label>
                        <select id="destination" required>
                            <option value="">-- 請選擇 --</option>
                            <option value="taipei">台北站</option>
                            <option value="hsinchu">新竹站</option>
                            <option value="miaoli">苗栗站</option>
                            <option value="taichung">台中站</option>
                            <option value="changhua">彰化站</option>
                            <option value="yunlin">雲林站</option>
                            <option value="chiayi">嘉義站</option>
                            <option value="tainan">台南站</option>
                            <option value="kaohsiung">高雄站</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>日期 <span class="required">*</span></label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label>人數 <span class="required">*</span></label>
                        <select id="passengers" required>
                            <option value="1">1人</option>
                            <option value="2">2人</option>
                            <option value="3">3人</option>
                            <option value="4">4人</option>
                            <option value="5">5人</option>
                            <option value="6">6人（享優惠）</option>
                            <option value="7">7人（享優惠）</option>
                            <option value="8">8人（享優惠）</option>
                            <option value="9">9人（享優惠）</option>
                            <option value="10">10人（享優惠）</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <input type="text" id="name" placeholder="請輸入姓名" required>
                    </div>

                    <div class="form-group">
                        <label>電子郵件 <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="請輸入電子郵件" required>
                    </div>

                    <div class="form-group">
                        <label>電話 <span class="required">*</span></label>
                        <input type="tel" id="phone" placeholder="請輸入電話號碼" required>
                    </div>

                    <div class="price-summary">
                        <h3>價格總結</h3>
                        <div class="price-row">
                            <span>基礎票價：</span>
                            <span id="basePrice">¥850</span>
                        </div>
                        <div class="price-row">
                            <span>人數：</span>
                            <span id="passengerCount">1</span>
                        </div>
                        <div class="price-row">
                            <span>優惠：</span>
                            <span id="discount">無</span>
                        </div>
                        <div class="price-row total">
                            <span>總價：</span>
                            <span id="totalPrice">¥850</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-button">確認訂票</button>
                </form>
            </div>

            <div class="booking-info">
                <h3>💡 訂票須知</h3>
                <ul>
                    <li>✓ 基礎票價 ¥850/人（高於一般高鐵票價）</li>
                    <li>✓ 6人以上享優惠：¥800/人</li>
                    <li>✓ 不定時有打折優惠活動</li>
                    <li>✓ 出發前24小時可免費取消</li>
                    <li>✓ 支持線上付款和現場現金付款</li>
                    <li>✓ 免費會員可累積點數換優惠</li>
                </ul>
            </div>
        </div>
    </section>

                <a href="contact.html">聯絡我們</a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
