<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壽司列車 - 高鐵美食新體驗</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 導航列 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo-section">
                <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- 高鐵 -->
                    <rect x="10" y="30" width="35" height="35" rx="8" fill="#E74C3C" opacity="0.9"/>
                    <circle cx="18" cy="42" r="4" fill="#FFF"/>
                    <circle cx="28" cy="42" r="4" fill="#FFF"/>
                    <circle cx="38" cy="42" r="4" fill="#FFF"/>
                    <polygon points="45,48 50,40 55,48" fill="#FFF"/>
                    <!-- 壽司 -->
                    <ellipse cx="70" cy="45" rx="18" ry="15" fill="#F5E6D3"/>
                    <circle cx="65" cy="42" r="5" fill="#2ECC71"/>
                    <circle cx="75" cy="42" r="5" fill="#E74C3C"/>
                    <path d="M 60 55 Q 70 58 80 55" stroke="#E74C3C" stroke-width="2" fill="none"/>
                </svg>
                <span class="brand-name">壽司列車</span>
            </div>
            <ul class="nav-links">
                <li><a href="#home">首頁</a></li>
                <li><a href="about.html">介紹</a></li>
                <li><a href="menu.html">菜單</a></li>
                <li><a href="booking.html">訂票</a></li>
                <li><a href="reviews.html">評價</a></li>
                <li><a href="membership.html">免費會員</a></li>
                <li><a href="contact.html">聯絡</a></li>
            </ul>
        </div>
    </nav>

    <!-- 首頁英雄區塊 -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>一邊進食，一邊旅行</h1>
            <p>全新壽司列車體驗，享受美食與速度的完美融合</p>
            <button class="cta-button" onclick="window.location.href='booking.html'">立即訂票</button>
        </div>
        <div class="hero-image">
            <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
                <!-- 列車主體 -->
                <rect x="40" y="80" width="220" height="60" rx="15" fill="#E74C3C"/>
                <!-- 車窗 -->
                <rect x="60" y="90" width="30" height="25" rx="5" fill="#87CEEB"/>
                <rect x="110" y="90" width="30" height="25" rx="5" fill="#87CEEB"/>
                <rect x="160" y="90" width="30" height="25" rx="5" fill="#87CEEB"/>
                <rect x="210" y="90" width="30" height="25" rx="5" fill="#87CEEB"/>
                <!-- 車輪 -->
                <circle cx="70" cy="145" r="8" fill="#333"/>
                <circle cx="150" cy="145" r="8" fill="#333"/>
                <circle cx="230" cy="145" r="8" fill="#333"/>
                <!-- 蒸汽 -->
                <circle cx="50" cy="70" r="5" fill="#F5E6D3" opacity="0.7"/>
                <circle cx="60" cy="65" r="6" fill="#F5E6D3" opacity="0.5"/>
                <circle cx="70" cy="70" r="5" fill="#F5E6D3" opacity="0.7"/>
            </svg>
        </div>
    </section>

    <!-- 廣告影片區塊（待補充） -->
    <section class="video-section">
        <div class="container">
            <h2>壹起體驗</h2>
            <div class="video-container">
                <iframe id="promotionVideo" width="100%" height="500" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <p class="video-note">影片連結待補充 - 請提供 YouTube 影片 ID</p>
        </div>
    </section>

    <!-- 特色亮點 -->
    <section class="highlights">
        <div class="container">
            <div class="highlight-card">
                <div class="highlight-icon">⚡</div>
                <h3>迅速到達</h3>
                <p>高鐵速度，享受美食的同時抵達目的地</p>
            </div>
            <div class="highlight-card">
                <div class="highlight-icon">🍣</div>
                <h3>精選美食</h3>
                <p>現場點餐，新鮮壽司直送到你的座位</p>
            </div>
            <div class="highlight-card">
                <div class="highlight-icon">💰</div>
                <h3>優惠價格</h3>
                <p>6人以上優惠，不定時打折活動</p>
            </div>
            <div class="highlight-card">
                <div class="highlight-icon">🎫</div>
                <h3>便捷訂票</h3>
                <p>線上訂票，快速便捷，多種付款方式</p>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 壽司列車。版權所有。</p>
            <div class="footer-links">
                <a href="#">隱私政策</a> | 
                <a href="#">服務條款</a> | 
                <a href="contact.html">聯絡我們</a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
